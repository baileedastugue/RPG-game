<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="assets/css/reset.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="assets/css/base.css">
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
    <title>Dino Fight</title>
</head>
<body>
    <div class="container">
        <div class="row">          
            <div id="dino-pick">Choose your fighter:</div><br>
        </div>

        <div class="row">            
            <img src="assets/images/dino1.png" class="dino" id="dinosaur1"><br>
            <img src="assets/images/dino2.png" class="dino" id="dinosaur2"><br>
            <img src="assets/images/dino3.png" class="dino" id="dinosaur3"><br>
            <img src="assets/images/dino4.png" class="dino" id="dinosaur4"><br>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-6" id="your-dino">
                <div id="current-fighter">
                    Your Dino Stats:<br>
                        <span id="fighter-HP">HP:</span><br>
                        <span id="fighter-AP">Attack Power:</span>
                </div>
            </div>
            <div class="col-6" id="your-opponent">
                <div id="current-opponent">
                    Enemy Dino Stats:<br>
                        <span id="opponent-HP">HP:</span><br>
                        <span id="opponent-AP">Counter-Attack Power:</span>
                </div>
            </div>
        </div>

        <div class="row">
            <button type="button" class="btn btn-warning" id="attack">attack!</button>
        </div>
    </div>

    <div class="container">
        <div class="row" id="game-play">
            <div id="defeated-dinos">Defeated dinos:</div><br>
            <br>
            <div id="dinos-left">Dinos left to fight:</div>                
        </div>
    </div>
    
</body>
<script src="assets/JS/game.js"></script>
</html>
