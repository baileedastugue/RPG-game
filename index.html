<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/assets/css/reset.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="/assets/css/base.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/style.css">
    <title>Dino Fight</title>
</head>
<body>
    <div class="container">
        <div class="row">          
            <div id="dino-pick">Choose your fighter:</div><br>
        </div>

        <div class="row" id="dino-container">            
            <img src="assets/images/dino1.png" class="dino caption" id="dinosaur1"><br>
            <img src="assets/images/dino2.png" class="dino caption" id="dinosaur2"><br>
            <img src="assets/images/dino3.png" class="dino caption" id="dinosaur3"><br>
            <img src="assets/images/dino4.png" class="dino caption" id="dinosaur4"><br>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-4 holdsDinos" id="your-dino">
            </div>
            <div class="col-5">
                <br><br>
                <h1 id="vs">VS</h1>
            </div>
            <div class="col-3" id="your-opponent">
            </div>
        </div>
        <div class="row">
            <div class="col-4 holdsDinos" id="current-fighter">
                Your Dino Stats:<br>
                    <span id="fighter-HP">HP:</span><br>
                    <span id="fighter-AP">Attack Power:</span>
            </div>
            <div class="col-4" id="game-commentary">
                
            </div>
            <div class="col-4" id="current-opponent">
                Enemy Dino Stats:<br>
                    <span id="opponent-HP">HP:</span><br>
                    <span id="opponent-AP">Counter-Attack Power:</span>
            </div>
        </div>

        <div class="row" id="buttons">
            <button type="button" class="btn btn-warning" id="attack">attack!</button>
            <a class="btn btn-primary" id="restart" href="https://baileedastugue.github.io/RPG-game/">restart</a button>
        </div>
    </div>

    <div class="container" id="game-play">
        <div class="row">
            <div id="dinos-left">Dinos left to fight:</div>   
        </div>
        <div class="row">             
            <div id="defeated-dinos">Defeated dinos:</div><br>
        </div>
    </div>
    
</body>
<script src="assets/JS/game.js"></script>
</html>
